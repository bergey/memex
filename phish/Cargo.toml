[package]
name = "phish"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
futures-util = "0.3.34"
lazy_static = "1.5.0"
log = "0.4.34"
prometheus = "0.14.0"
rand = {version = "0.10.2", features = [ "thread_rng" ] }
rand_distr = "0.6.0"
tokio = { workspace = true, features = [ "time", "rt" ] }
