[package]
name = "client"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow.workspace = true
automerge.workspace = true
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
wasm-bindgen = "0.2.121"
getrandom = { version = "0.4.2", features = ['wasm_js'] }
log = "0.4.29"
js-sys = "0.3.99"
leptos = { version = "0.8.19", features = ["csr"] }

[dependencies.web-sys]
version = "0.3.98"
features = [
  'BinaryType',
  'Blob',
  'CanvasRenderingContext2d',
  'console',
  'Document',
  'DomRect',
  'Element',
  'HtmlCanvasElement',
  'HtmlInputElement',
  'HtmlOptionElement',
  'HtmlSelectElement',
  'KeyboardEvent',
  'MessageEvent',
  'MouseEvent',
  'PointerEvent',
  'Storage',
  'Touch',
  'TouchEvent',
  'TouchList',
  'WebSocket',
  'Window',
]
