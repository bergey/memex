[package]
name = "client"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
memex-shared = { path = "../memex-shared" }
anyhow.workspace = true
automerge.workspace = true
console_error_panic_hook = "0.1.7"
futures = "0.3.32"
getrandom = { workspace = true, features = ['wasm_js'] }
indexed_db_futures = { version = "0.6.4", features = ["typed-arrays"] }
js-sys = "0.3.99"
leptos = { version = "0.8.19", features = ["csr"] }
tracing.workspace = true
wasm-bindgen = "0.2.121"
wasm-bindgen-futures = "0.4.72"
wasm-tracing = "2.1.0"

[dependencies.web-sys]
version = "0.3.98"
features = [
  'BinaryType',
  'Blob',
  'CanvasRenderingContext2d',
  'console',
  'Document',
  'DomRect',
  'Element',
  'HtmlCanvasElement',
  'HtmlInputElement',
  'HtmlOptionElement',
  'HtmlSelectElement',
  'KeyboardEvent',
  'MessageEvent',
  'MouseEvent',
  'PointerEvent',
  'Storage',
  'Touch',
  'TouchEvent',
  'TouchList',
  'WebSocket',
  'Window',
]

[dev-dependencies]
proptest = "1.11.0"
