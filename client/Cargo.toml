[package]
name = "client"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
memex-query.path = "../query"
memex-shared.path = "../memex-shared"
anyhow.workspace = true
automerge.workspace = true
console_error_panic_hook = "0.1.7"
futures = "0.3.34"
getrandom = { workspace = true, features = ['wasm_js'] }
indexed_db_futures = { version = "0.6.4", features = ["typed-arrays"] }
js-sys = "0.3.106"
leptos = { version = "0.8.22", features = ["csr"] }
tracing.workspace = true
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
wasm-tracing = "2.1.0"
serde-wasm-bindgen = "0.6.5"
serde.workspace = true

[dependencies.web-sys]
version = "0.3.106"
features = [
  'BinaryType',
  'Blob',
  'BroadcastChannel',
  'CanvasRenderingContext2d',
  'console',
  'Document',
  'DomRect',
  'Element',
  'HtmlCanvasElement',
  'HtmlInputElement',
  'HtmlOptionElement',
  'HtmlSelectElement',
  'KeyboardEvent',
  'MessageEvent',
  'MessagePort',
  'MouseEvent',
  'PointerEvent',
  'SharedWorker',
  'Storage',
  'Touch',
  'TouchEvent',
  'TouchList',
  'WebSocket',
  'Window',
]

[dev-dependencies]
proptest = "1.12.0"
