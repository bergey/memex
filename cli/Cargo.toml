[package]
name = "memex"
description = "enhanced search for Zotero & Calibre"
version = "0.1.2"
repository = "https://github.com/bergey/memex"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
clap = { version = "4.0.29", features = ["derive"] }
futures-util = "0.3.31"
glob = "0.3.2"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.42.0", features = [ "rt-multi-thread", "macros" ] }
winnow = "1.0.4"
