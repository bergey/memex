[workspace]
members = ["client", "server", "cli", "memex-shared", "query"]
default-members = ["client", "server", "memex-shared"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Daniel Bergey"]

[workspace.dependencies]
automerge = "0.10.0"
anyhow = "1.0.102"
ciborium = "0.2.2"
sqlx = "0.9.0"
tokio = "1.52.3"
tracing = "0.1.44"
uuid = "1.24.1"
getrandom = "0.4.3"

[profile.release]
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
